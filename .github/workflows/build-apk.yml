name: Build InstaTube Toolkit APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Gradle wrapper
        run: chmod +x InstaDownload/gradlew
      - name: Verify repository structure
        run: python3 scripts/verify_source.py
      - name: Build debug APK
        working-directory: InstaDownload
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Rename APK
        run: cp InstaDownload/app/build/outputs/apk/debug/app-debug.apk InstaTube-Toolkit-Xboy-Rex-v1.3.0-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaTube-Toolkit-debug-apk
          path: InstaTube-Toolkit-Xboy-Rex-v1.3.0-debug.apk
          retention-days: 30
